name: Segurança do repositório

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Impedir credenciais versionadas
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar arquivos e assinaturas sensíveis
        run: node scripts/check-secrets.js
